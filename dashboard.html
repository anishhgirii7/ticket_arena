<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tickets – Ticket Arena</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html" class="logo">TICKET<span>ARENA</span></a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="events.html">Events</a></li>
            <li><a href="dashboard.html">My Tickets</a></li>
        </ul>
        <div class="nav-buttons">
            <a href="login.html" class="btn-outline">Login</a>
        </div>
    </nav>

    <main style="max-width:1100px;margin:0 auto;padding:130px 24px 60px;">
        <div style="margin-bottom:28px;">
            <h1 style="font-family:'Bebas Neue',sans-serif;font-size:56px;letter-spacing:2px;">MY <span style="color:var(--red);">TICKETS</span></h1>
            <p style="color:var(--muted);margin-top:8px;">Your recent bookings will appear here.</p>
        </div>
        <div id="ticketList"></div>
    </main>

    <footer>
        <div>
            <div class="footer-logo">TICKET<span>ARENA</span></div>
            <div class="footer-text">© 2026 TicketArena. All rights reserved.</div>
        </div>
        <ul class="footer-links">
            <li><a href="events.html">Events</a></li>
            <li><a href="index.html">Home</a></li>
        </ul>
    </footer>

    <script src="main.js"></script>
    <script>


async function loadMyTickets() {
    const user = JSON.parse(sessionStorage.getItem('user') || '{}');
    const list = document.getElementById('ticketList');

    if (!user.id && !user.full_name) {
        list.innerHTML = '<p style="color:var(--muted)">Please <a href="login.html" style="color:var(--red)">log in</a> to see your tickets.</p>';
        return;
    }

    try {
        const res = await fetch(`${API}/api/bookings/my?user_id=${user.id}`, {
            credentials: 'include'
        });
        const bookings = await res.json();

        if (!bookings.length) {
            list.innerHTML = '<p style="color:var(--muted)">No bookings yet. <a href="events.html" style="color:var(--red)">Browse events →</a></p>';
            return;
        }

        list.innerHTML = bookings.map(b => `
            <div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;">
                <div>
                    <div style="color:var(--red);font-size:12px;font-weight:600;text-transform:uppercase;margin-bottom:6px;">${b.sport}</div>
                    <div style="font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:1px;">${b.event_title}</div>
                    <div style="color:var(--muted);margin-top:6px;font-size:14px;">
                        📅 ${new Date(b.event_date).toLocaleDateString('en-AU', {day:'numeric', month:'short', year:'numeric'})}
                        &nbsp;|&nbsp; 🏟️ ${b.venue}, ${b.city}
                        &nbsp;|&nbsp; 🎟️ ${b.quantity} ticket${b.quantity > 1 ? 's' : ''}
                    </div>
                    <div style="margin-top:8px;">
                        <span style="background:${b.status === 'Confirmed' ? '#1a3a1a' : '#3a1a1a'};color:${b.status === 'Confirmed' ? '#4caf50' : '#f44336'};padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;">${b.status}</span>
                    </div>
                </div>
                <div style="text-align:right;">
                    <div style="font-family:'Bebas Neue',sans-serif;font-size:36px;color:var(--red);">$${parseFloat(b.total_amount).toFixed(2)}</div>
                    <div style="color:var(--muted);font-size:12px;">Booking #${b.id}</div>
                    <div style="color:var(--muted);font-size:12px;margin-bottom:12px;">Booked: ${new Date(b.created_at).toLocaleDateString('en-AU')}</div>
                    ${b.status === 'Confirmed' ? `
                        <button 
                            onclick="cancelBooking(${b.id}, ${user.id})"
                            style="background:transparent;border:1px solid #f44336;color:#f44336;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600;transition:all 0.2s;"
                            onmouseover="this.style.background='#f44336';this.style.color='white'"
                            onmouseout="this.style.background='transparent';this.style.color='#f44336'"
                        >Cancel Booking</button>
                    ` : `
                        <span style="color:#f44336;font-size:13px;font-weight:600;">CANCELLED</span>
                    `}
                </div>
            </div>
        `).join('');

    } catch (err) {
        list.innerHTML = '<p style="color:red">Could not load tickets. Make sure backend is running.</p>';
    }
}

async function cancelBooking(bookingId, userId) {
    const confirmed = confirm('Are you sure you want to cancel this booking? This cannot be undone.');
    if (!confirmed) return;

    try {
        const res = await fetch(`${API}/api/bookings/${bookingId}/cancel?user_id=${userId}`, {
            method: 'PUT',
            credentials: 'include'
        });
        const data = await res.json();

        if (res.ok) {
            alert('✅ Booking cancelled successfully. Seats have been released.');
            loadMyTickets(); // Refresh the list
        } else {
            alert(data.error || 'Could not cancel booking.');
        }
    } catch (err) {
        alert('Cannot connect to server. Make sure backend is running.');
    }
}

loadMyTickets();
</script>
</body>
</html>
