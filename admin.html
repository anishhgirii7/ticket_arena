<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel – Ticket Arena</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0a0a0a; color: #fff; }
        .admin-container { max-width: 1100px; margin: 0 auto; padding: 40px 24px; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        .admin-title { font-family: 'Bebas Neue', sans-serif; font-size: 48px; }
        .admin-title span { color: #e63946; }
        table { width: 100%; border-collapse: collapse; background: #111; border-radius: 12px; overflow: hidden; margin-bottom: 32px; }
        th { background: #1a1a1a; padding: 14px 16px; text-align: left; font-size: 12px; text-transform: uppercase; color: #888; }
        td { padding: 14px 16px; border-bottom: 1px solid #222; font-size: 14px; }
        tr:last-child td { border-bottom: none; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; }
        .badge-green { background: #1a3a1a; color: #4caf50; }
        .badge-red { background: #3a1a1a; color: #f44336; }
        .btn-delete { background: transparent; border: 1px solid #f44336; color: #f44336; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; }
        .btn-delete:hover { background: #f44336; color: white; }
        .btn-primary { background: #e63946; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .btn-primary:hover { background: #c1121f; }
        .btn-logout { background: transparent; border: 1px solid #888; color: #888; padding: 8px 16px; border-radius: 6px; cursor: pointer; }

        /* Login Screen */
        .login-screen { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-box { background: #111; border: 1px solid #222; border-radius: 16px; padding: 40px; width: 100%; max-width: 400px; }
        .login-box h2 { font-family: 'Bebas Neue', sans-serif; font-size: 36px; margin-bottom: 24px; }
        .login-box h2 span { color: #e63946; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; color: #888; margin-bottom: 6px; }
        .form-group input, .form-group select { width: 100%; padding: 12px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; color: white; font-size: 14px; box-sizing: border-box; }
        .error-msg { color: #f44336; font-size: 13px; margin-top: 8px; display: none; }

        /* Add Event Form */
        .add-event-form { background: #111; border: 1px solid #222; border-radius: 12px; padding: 24px; margin-bottom: 32px; }
        .add-event-form h3 { font-family: 'Bebas Neue', sans-serif; font-size: 28px; margin-bottom: 20px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .section-title { font-family: 'Bebas Neue', sans-serif; font-size: 28px; margin-bottom: 16px; }
    </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div class="login-screen" id="loginScreen">
    <div class="login-box">
        <h2>ADMIN <span>LOGIN</span></h2>
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="adminUser" placeholder="admin">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="adminPass" placeholder="••••••••">
        </div>
        <div class="error-msg" id="loginError">Invalid credentials.</div>
        <br>
        <button class="btn-primary" style="width:100%" onclick="adminLogin()">Login as Admin</button>
        <br><br>
        <a href="index.html" style="color:#888;font-size:13px;">← Back to site</a>
    </div>
</div>

<!-- ADMIN PANEL -->
<div class="admin-container" id="adminPanel" style="display:none">
    <div class="admin-header">
        <div class="admin-title">ADMIN <span>PANEL</span></div>
        <div style="display:flex;gap:12px;align-items:center;">
            <span style="color:#888;font-size:14px;">🔐 Logged in as Admin</span>
            <button class="btn-logout" onclick="adminLogout()">Logout</button>
            <a href="index.html" style="color:#888;font-size:13px;">← Back to site</a>
        </div>
    </div>

    <!-- ADD EVENT FORM -->
    <div class="add-event-form">
        <h3>➕ ADD NEW EVENT</h3>
        <div class="form-grid">
            <div class="form-group">
                <label>Event Title</label>
                <input type="text" id="newTitle" placeholder="e.g. NRL Grand Final 2026">
            </div>
            <div class="form-group">
                <label>Sport Category</label>
                <select id="newCategory">
                    <option value="1">Cricket</option>
                    <option value="2">Football</option>
                    <option value="3">AFL</option>
                    <option value="4">Basketball</option>
                    <option value="5">Tennis</option>
                    <option value="6">Boxing</option>
                </select>
            </div>
            <div class="form-group">
                <label>Venue</label>
                <select id="newVenue">
                    <option value="1">MCG, Melbourne</option>
                    <option value="2">Accor Stadium, Sydney</option>
                    <option value="3">Rod Laver Arena, Melbourne</option>
                    <option value="4">Qudos Bank Arena, Sydney</option>
                    <option value="5">Marvel Stadium, Melbourne</option>
                </select>
            </div>
            <div class="form-group">
                <label>Event Date</label>
                <input type="date" id="newDate">
            </div>
            <div class="form-group">
                <label>Event Time</label>
                <input type="time" id="newTime">
            </div>
            <div class="form-group">
                <label>Price ($)</label>
                <input type="number" id="newPrice" placeholder="75">
            </div>
            <div class="form-group">
                <label>Total Seats</label>
                <input type="number" id="newSeats" placeholder="500">
            </div>
        </div>
        <br>
        <button class="btn-primary" onclick="addEvent()">➕ Add Event</button>
        <span id="addMsg" style="margin-left:16px;font-size:13px;color:#4caf50;display:none;">✅ Event added!</span>
    </div>

    <!-- EVENTS TABLE -->
    <div class="section-title">📋 ALL EVENTS</div>
    <table id="eventsTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Event</th>
                <th>Sport</th>
                <th>Venue</th>
                <th>Date</th>
                <th>Price</th>
                <th>Seats Left</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="eventsBody">
            <tr><td colspan="9" style="color:#888;text-align:center;">Loading...</td></tr>
        </tbody>
    </table>
</div>

<script>
const API = 'https://ticket-arena-backend-production.up.railway.app';

async function adminLogin() {
    const username = document.getElementById('adminUser').value.trim();
    const password = document.getElementById('adminPass').value.trim();

    try {
        const res = await fetch(`${API}/api/auth/admin-login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (res.ok) {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
            loadEvents();
        } else {
            document.getElementById('loginError').style.display = 'block';
            document.getElementById('loginError').textContent = data.error;
        }
    } catch (err) {
        document.getElementById('loginError').style.display = 'block';
        document.getElementById('loginError').textContent = 'Cannot connect to server.';
    }
}

async function loadEvents() {
    try {
        const res = await fetch(`${API}/api/auth/admin/events`, { credentials: 'include' });
        const events = await res.json();
        const tbody = document.getElementById('eventsBody');

        if (!events.length) {
            tbody.innerHTML = '<tr><td colspan="9" style="color:#888;text-align:center;">No events found.</td></tr>';
            return;
        }

        tbody.innerHTML = events.map(e => `
            <tr>
                <td style="color:#888">#${e.event_id}</td>
                <td style="font-weight:600">${e.event_title}</td>
                <td>${e.sport}</td>
                <td>${e.venue}</td>
                <td>${new Date(e.event_date).toLocaleDateString('en-AU', {day:'numeric', month:'short', year:'numeric'})}</td>
                <td style="color:#e63946;font-weight:600">$${parseFloat(e.price).toFixed(2)}</td>
                <td>${e.available_seats} / ${e.total_seats}</td>
                <td><span class="badge ${e.status === 'Available' ? 'badge-green' : 'badge-red'}">${e.status}</span></td>
                <td>
                    <button class="btn-delete" onclick="deleteEvent(${e.event_id}, '${e.event_title}')">🗑️ Delete</button>
                </td>
            </tr>
        `).join('');
    } catch (err) {
        document.getElementById('eventsBody').innerHTML = '<tr><td colspan="9" style="color:red">Could not load events.</td></tr>';
    }
}

async function deleteEvent(id, title) {
    if (!confirm(`Are you sure you want to delete "${title}"? This will also delete all bookings for this event.`)) return;

    try {
        const res = await fetch(`${API}/api/auth/admin/events/${id}`, {
            method: 'DELETE',
            credentials: 'include'
        });
        const data = await res.json();
        if (res.ok) {
            alert('✅ Event deleted successfully!');
            loadEvents();
        } else {
            alert(data.error || 'Could not delete event.');
        }
    } catch (err) {
        alert('Cannot connect to server.');
    }
}

async function addEvent() {
    const event_title = document.getElementById('newTitle').value.trim();
    const category_id = document.getElementById('newCategory').value;
    const venue_id = document.getElementById('newVenue').value;
    const event_date = document.getElementById('newDate').value;
    const event_time = document.getElementById('newTime').value;
    const price = document.getElementById('newPrice').value;
    const total_seats = document.getElementById('newSeats').value;

    if (!event_title || !event_date || !event_time || !price || !total_seats) {
        alert('Please fill in all fields.');
        return;
    }

    try {
        const res = await fetch(`${API}/api/auth/admin/events`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ event_title, category_id, venue_id, event_date, event_time, price, total_seats })
        });
        const data = await res.json();
        if (res.ok) {
            document.getElementById('addMsg').style.display = 'inline';
            setTimeout(() => document.getElementById('addMsg').style.display = 'none', 3000);
            // Clear form
            document.getElementById('newTitle').value = '';
            document.getElementById('newDate').value = '';
            document.getElementById('newTime').value = '';
            document.getElementById('newPrice').value = '';
            document.getElementById('newSeats').value = '';
            loadEvents();
        } else {
            alert(data.error || 'Could not add event.');
        }
    } catch (err) {
        alert('Cannot connect to server.');
    }
}

function adminLogout() {
    document.getElementById('adminPanel').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
}
</script>
</body>
</html>
